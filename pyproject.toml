[project]
name = "urdyn-memory"
version = "0.3.0"
description = "A standalone, local-first, persistent, model-independent memory engine"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Leonardo Panconi", email = "krankxxx0@proton.me" }
]
requires-python = ">=3.12"
keywords = [
    "memory",
    "local-first",
    "ai",
    "agents",
    "knowledge-management",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
# Every package here is imported DIRECTLY by `_semantic.py`; none is
# relied on transitively. `model2vec` and the potion backend it provided
# were removed together -- no production path or test needs them any
# more, and rollback is a `git revert`, not a pinned leftover.
semantic = [
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15,<1.0",
    "huggingface-hub>=0.20,<2.0",
    "numpy>=1.26",
]

[project.scripts]
urdyn = "urdyn._cli:main"

[project.urls]
Homepage = "https://github.com/Pankrazio/urdyn-memory"
Repository = "https://github.com/Pankrazio/urdyn-memory"
Issues = "https://github.com/Pankrazio/urdyn-memory/issues"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "urdyn"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
markers = [
    "real_model: exercises the real ONNX sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 model; skipped unless it is already cached locally (see tests/test_semantic_real_model.py)",
]
