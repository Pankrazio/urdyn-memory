[project]
name = "cortex-memory"
version = "0.1.0"
description = "A standalone, local-first, persistent, model-independent memory engine"
readme = "README.md"
authors = [
    { name = "Leonardo Panconi", email = "krankxxx0@proton.me" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
semantic = ["model2vec>=0.8.0,<0.9.0", "numpy>=1.26"]

[project.scripts]
cortex = "cortex_memory._cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
markers = [
    "real_model: exercises the real model2vec/potion-retrieval-32M model; skipped unless it is already cached locally (see tests/test_semantic_real_model.py)",
]
